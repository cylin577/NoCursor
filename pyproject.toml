[project]
name = "nocursor"
version = "0.1.0"
description = "Transformer-based human-like cursor movement synthesizer"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
play = ["pynput>=1.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
